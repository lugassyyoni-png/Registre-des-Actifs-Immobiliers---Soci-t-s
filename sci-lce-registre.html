<div id="lock-screen" style="max-width:400px; margin:80px auto; font-family:-apple-system,Helvetica,Arial,sans-serif; background:#FBF7EE; border:1px solid #DCD2B8; border-top:3px solid #B08D57; border-radius:14px; padding:32px; text-align:center;">
  <div style="font-family:'Fraunces',Georgia,serif; font-size:21px; color:#1C2333; margin-bottom:6px;">Registre des actifs immobiliers</div>
  <div style="font-size:12.5px; color:#948B72; margin-bottom:20px;">Accès protégé — entrez le mot de passe</div>
  <form id="lock-form" autocomplete="on">
    <input type="text" name="username" autocomplete="username" value="registre-lce" readonly style="position:absolute; opacity:0; height:0; width:0; border:0; padding:0;" tabindex="-1" aria-hidden="true">
    <input type="password" id="lock-input" name="password" autocomplete="current-password" placeholder="Mot de passe" style="width:100%; padding:10px 12px; border:1px solid #DCD2B8; border-radius:8px; font-size:14px; margin-bottom:10px; box-sizing:border-box;">
    <button type="submit" id="lock-submit" style="width:100%; padding:10px 12px; border:none; background:#1C2333; color:#FBF7EE; border-radius:8px; font-size:14px; cursor:pointer;">Accéder</button>
  </form>
  <div id="lock-error" style="color:#D2543B; font-size:12px; margin-top:10px; display:none;">Mot de passe incorrect.</div>
</div>

<script>
(function(){
  const SITE_PASSWORD = 'LCE-patrimoine-26';
  const lockScreen = document.getElementById('lock-screen');
  const appEl = document.getElementById('sci-app');
  const form = document.getElementById('lock-form');
  const input = document.getElementById('lock-input');
  const errorEl = document.getElementById('lock-error');

  function tryUnlock(){
    if (input.value === SITE_PASSWORD) {
      try { sessionStorage.setItem('lce-registre-unlocked', 'yes'); } catch(e) {}
      lockScreen.style.display = 'none';
      appEl.style.display = 'block';
    } else {
      errorEl.style.display = 'block';
      input.value = '';
      input.focus();
    }
  }

  let alreadyUnlocked = false;
  try { alreadyUnlocked = sessionStorage.getItem('lce-registre-unlocked') === 'yes'; } catch(e) {}

  if (alreadyUnlocked) {
    lockScreen.style.display = 'none';
    appEl.style.display = 'block';
  } else {
    form.addEventListener('submit', function(e){ e.preventDefault(); tryUnlock(); });
    input.focus();
  }
})();
</script>

  function addInterval(dateStr, recurrence){
    if (!dateStr || !recurrence) return null;
    const d = new Date(dateStr);
    if (isNaN(d.getTime())) return null;
    if (recurrence === 'mensuelle') d.setMonth(d.getMonth()+1);
    else if (recurrence === 'trimestrielle') d.setMonth(d.getMonth()+3);
    else if (recurrence === 'annuelle') d.setFullYear(d.getFullYear()+1);
    else return null;
    return d.toISOString().slice(0,10);
  }

  // Redimensionne et compresse une photo avant de la stocker en base64 —
  // l'affichage sur le site ne dépasse jamais 460 px de haut, donc inutile
  // de garder une photo de téléphone à pleine résolution (souvent 3-5 Mo).
  function resizeImageForStorage(file, maxWidth, quality){
    return new Promise((resolve, reject) => {
      const reader = new FileReader();
      reader.onerror = () => reject(new Error('Lecture du fichier impossible'));
      reader.onload = () => {
        const img = new Image();
        img.onerror = () => reject(new Error('Fichier image illisible'));
        img.onload = () => {
          let width = img.naturalWidth, height = img.naturalHeight;
          if (width > maxWidth) {
            height = Math.round(height * (maxWidth / width));
            width = maxWidth;
          }
          const canvas = document.createElement('canvas');
          canvas.width = width;
          canvas.height = height;
          canvas.getContext('2d').drawImage(img, 0, 0, width, height);
          resolve(canvas.toDataURL('image/jpeg', quality));
        };
        img.src = reader.result;
      };
      reader.readAsDataURL(file);
    });
  }

  async function load(){
    try {
      const res = await fetch(BACKEND_URL + '?key=' + encodeURIComponent(API_KEY));
      const json = await res.json();
      if (json.error) throw new Error(json.error);
      scis = (json.scis && json.scis.length) ? json.scis : defaultScis;
      properties = (json.properties && json.properties.length) ? json.properties : defaultProperties;
      dataLoaded = true;
      loadError = false;
    } catch(e) {
      // Sécurité : si le chargement échoue, on NE bascule PAS sur des données
      // par défaut et on INTERDIT toute sauvegarde, pour ne jamais risquer
      // d'écraser les vraies données avec un jeu de données vide ou minimal.
      console.error('Erreur de chargement du registre — sauvegarde désactivée par sécurité', e);
      scis = [];
      properties = [];
      dataLoaded = false;
      loadError = true;
    }
    render();
  }

  let deletedPropertyIds = [];
  let deletedSciIds = [];
  let touchedPropertyIds = new Set();
  let touchedSciIds = new Set();
  let dataLoaded = false;
  let loadError = false;

  async function save(){
    if (!dataLoaded) {
      console.error('Sauvegarde bloquée : le chargement initial des données n\'a pas réussi.');
      const flag = document.getElementById('save-flag');
      if (flag) { flag.textContent = 'Sauvegarde bloquée — rechargez la page'; flag.style.color = '#D2543B'; }
      return false;
    }
    try {
      const res = await fetch(BACKEND_URL + '?key=' + encodeURIComponent(API_KEY));
      const remote = await res.json();
      const remoteScis = remote.scis || [];
      const remoteProps = remote.properties || [];

      const sciMap = {};
      remoteScis.forEach(s => { if (!deletedSciIds.includes(s.id)) sciMap[s.id] = s; });
      scis.forEach(s => { if (touchedSciIds.has(s.id) || !sciMap[s.id]) sciMap[s.id] = s; });
      deletedSciIds.forEach(id => { delete sciMap[id]; });
      const mergedScis = Object.values(sciMap);

      const propMap = {};
      remoteProps.forEach(p => { if (!deletedPropertyIds.includes(p.id)) propMap[p.id] = p; });
      properties.forEach(p => { if (touchedPropertyIds.has(p.id) || !propMap[p.id]) propMap[p.id] = p; });
      deletedPropertyIds.forEach(id => { delete propMap[id]; });
      const mergedProps = Object.values(propMap);

      scis = mergedScis;
      properties = mergedProps;

      const postRes = await fetch(BACKEND_URL, {
        method: 'POST',
        body: JSON.stringify({ key: API_KEY, scis: mergedScis, properties: mergedProps })
      });
      const json = await postRes.json();
      if (json.error) throw new Error(json.error);
      flashSaved();
      return true;
    } catch(e) {
      console.error('Erreur de sauvegarde', e);
      const flag = document.getElementById('save-flag');
      // Le message reste affiché tant qu'aucune sauvegarde n'a réussi depuis —
      // pour ne pas manquer un échec (auparavant il disparaissait après 3 s).
      if (flag) { flag.textContent = '⚠ Échec de la sauvegarde — vos derniers changements ne sont pas enregistrés'; flag.style.color = '#D2543B'; flag.style.fontWeight = '700'; }
      return false;
    }
  }

        montants: { loyerHT: amounts.loyerHT, charges: amounts.charges, tva: amounts.tva, totalTTC: amounts.totalTTC, tvaTauxPct: tvaTauxPct }
      };
    }

    genBusy = true; genMessage = ''; render();
    try {
      const res = await fetch(BACKEND_URL, { method: 'POST', body: JSON.stringify(payload) });
      const data = await res.json();
      if (data.error) {
        genMessage = 'Erreur : ' + data.error;
        if (draftWin && !draftWin.closed) draftWin.close();
      }
      else if (data.draftUrl) {
        genDraftUrl = data.draftUrl;
        if (draftWin && !draftWin.closed) {
          draftWin.location = data.draftUrl;
          genMessage = 'Brouillon prêt — ouvert dans un nouvel onglet Gmail.';
        } else {
          genMessage = "Brouillon prêt — le navigateur a bloqué l'ouverture automatique, utilisez le lien ci-dessous.";
        }
        if (!p.documents_generes) p.documents_generes = [];
        p.documents_generes.push({ date: new Date().toISOString(), docType: genDocType, periode: periodeForHistory });
        save();
      }
      else { genMessage = 'Réponse inattendue du serveur.'; if (draftWin && !draftWin.closed) draftWin.close(); }
    } catch(e) {
      genMessage = 'Erreur réseau : ' + e.message;
      if (draftWin && !draftWin.closed) draftWin.close();
    }
    genBusy = false; render();
  }

  function computePaymentStatus(p){
    const reg = p.loyer_registre || {};
    const now = new Date();
    let best = null;
    Object.keys(reg).forEach(y => {
      Object.keys(reg[y]).forEach(m => {
        const d = new Date(parseInt(y,10), parseInt(m,10)-1, 1);
        if (d <= now && (!best || d > best.date)) best = { date: d, entry: reg[y][m], y, m };
      });
    });

    const status = loyerRowStatus(best.entry, best.y, best.m);
    if (status === 'verse') return { key: 'ok', label: 'À jour' };
    if (status === 'partiel') return { key: 'partiel', label: 'Partiellement versé' };
    if (status === 'impaye') return { key: 'late', label: 'Impayé' };
    return { key: 'attente', label: 'Paiement attendu' };

  function tvaRateFor(p){
    return p.bail_tva === 'Assujetti' ? 0.20 : 0;
  }

  function defaultMonthlyLoyer(p){
    // Valeur utilisée à la fois pour l'affichage mensuel et pour les documents
    // générés (avis, quittances) — une seule fonction pour éviter tout écart
    // d'arrondi entre les deux.
    return p.loyer ? Math.round((parseNum(p.loyer)||0)/12) : 0;
  }

  function loyerMonthAmounts(p, entry, defaultMontant, defaultCharges){
    const loyerHT = entry && entry.montant !== '' && entry.montant != null ? (parseNum(entry.montant)||0) : (defaultMontant||0);
    const charges = entry && entry.charges !== '' && entry.charges != null ? (parseNum(entry.charges)||0) : (defaultCharges||0);
    const tvaRate = tvaRateFor(p);
    const tva = Math.round((loyerHT + charges) * tvaRate * 100) / 100;
    const totalTTC = Math.round((loyerHT + charges + tva) * 100) / 100;
    return { loyerHT, charges, tva, totalTTC };
  }

  function loyerRowStatus(entry, year, month){
    const dueDate = new Date(parseInt(year,10), parseInt(month,10)-1, 1);
    const now = new Date(); now.setHours(0,0,0,0);
    if (dueDate > now) return 'future';
    if (entry.statut === 'verse') return 'verse';
    if (entry.statut === 'partiel') return 'partiel';
    const daysLate = Math.floor((now - dueDate) / 86400000);
    return daysLate > 7 ? 'impaye' : 'attente-paiement';
  }

  function getLoyerAlerts(propList){
    const alerts = [];
    const now = new Date(); now.setHours(0,0,0,0);
    const monthNames = ['janvier','février','mars','avril','mai','juin','juillet','août','septembre','octobre','novembre','décembre'];
    propList.forEach(p => {
      const reg = p.loyer_registre || {};
      Object.keys(reg).forEach(y => {
        Object.keys(reg[y]).forEach(m => {
          const entry = reg[y][m];
          const status = loyerRowStatus(entry, y, m);
          if (status === 'impaye') {
            const dueDate = new Date(parseInt(y,10), parseInt(m,10)-1, 1);
            const daysLate = Math.floor((now - dueDate) / 86400000);
            alerts.push({ prop: p, daysLate, text: `Loyer impayé — ${esc(propLabel(p))} : ${monthNames[parseInt(m,10)-1]} ${y}, en retard de ${daysLate} j` });
          }
        });
      });
    });
    alerts.sort((a,b) => b.daysLate - a.daysLate);
    return alerts;
  }

  const MONTH_NAMES_FULL = ['Janvier','Février','Mars','Avril','Mai','Juin','Juillet','Août','Septembre','Octobre','Novembre','Décembre'];

  function quarterMonths(q){
    const start = (parseInt(q,10)-1)*3+1;
    return [start, start+1, start+2].map(m=>String(m).padStart(2,'0'));
  }

  function monthToQuarter(m){
    return Math.ceil(parseInt(m,10)/3);
  }

  function periodLabel(periodType, year, monthOrQuarter){
    if (periodType === 'trimestre') return `${monthOrQuarter}e trimestre ${year}`;
    return `${MONTH_NAMES_FULL[parseInt(monthOrQuarter,10)-1]} ${year}`;
  }

  function periodGrammaire(periodType, year, monthOrQuarter){
    if (periodType === 'trimestre') return `${monthOrQuarter}e trimestre ${year}`;
    return `mois de ${MONTH_NAMES_FULL[parseInt(monthOrQuarter,10)-1]} ${year}`;
  }

  function periodDates(periodType, year, monthOrQuarter){
    const y = parseInt(year,10);
    if (periodType === 'trimestre') {
      const q = parseInt(monthOrQuarter,10);
      const startMonth = (q-1)*3;
      return { start: new Date(y, startMonth, 1), end: new Date(y, startMonth+3, 0) };
    }
    const mIdx = parseInt(monthOrQuarter,10)-1;
    return { start: new Date(y, mIdx, 1), end: new Date(y, mIdx+1, 0) };
  }

  function formatDateFRLong(d){
    return String(d.getDate()).padStart(2,'0') + '/' + String(d.getMonth()+1).padStart(2,'0') + '/' + d.getFullYear();
  }

  function formatDateFRShort(d){
    return String(d.getDate()).padStart(2,'0') + '/' + String(d.getMonth()+1).padStart(2,'0');
  }

  function computePeriodAmounts(p, periodType, year, monthOrQuarter){
    const reg = (p.loyer_registre && p.loyer_registre[year]) || {};
    const months = periodType === 'trimestre' ? quarterMonths(monthOrQuarter) : [String(monthOrQuarter).padStart(2,'0')];
    const defaultMontant = defaultMonthlyLoyer(p);
    const defaultCharges = p.charges_mensuelles ? (parseNum(p.charges_mensuelles)||0) : 0;
    let loyerHT = 0, charges = 0, allVerse = true, anyData = false;
    months.forEach(mm => {
      const entry = reg[mm];
      if (entry) anyData = true;
      const amounts = loyerMonthAmounts(p, entry, defaultMontant, defaultCharges);
      loyerHT += amounts.loyerHT;
      charges += amounts.charges;
      if (!entry || entry.statut !== 'verse') allVerse = false;
    });
    const tvaRate = tvaRateFor(p);
    const tva = Math.round((loyerHT + charges) * tvaRate * 100) / 100;
    const totalTTC = Math.round((loyerHT + charges + tva) * 100) / 100;
    return { months, loyerHT: Math.round(loyerHT*100)/100, charges: Math.round(charges*100)/100, tva, totalTTC, allVerse, anyData };
  }

  function renderCreditRegistre(p){
    if (!p.credit_registre) p.credit_registre = {};
    const years = Object.keys(p.credit_registre).sort();
    const yearBlocks = years.map(y => {
      const monthsObj = p.credit_registre[y];
      const monthKeys = Object.keys(monthsObj).sort();
      const nbPaye = monthKeys.filter(mm => monthsObj[mm].statut==='verse').length;
      const expanded = expandedCreditYear === y;
      let monthsHtml = '';
      if (expanded) {
        monthsHtml = monthKeys.map(mm => {
          const entry = monthsObj[mm];
          const now = new Date(); now.setDate(1); now.setHours(0,0,0,0);
          const monthDate = new Date(parseInt(y,10), parseInt(mm,10)-1, 1);
          const isFuture = monthDate > now;
          const status = entry.statut === 'verse' ? 'verse' : (isFuture ? 'future' : 'neutre');
          return `
            <div class="credit-month-row row-${status}" data-year="${y}" data-month="${mm}">
              <span class="cm2-label">${MONTH_NAMES_FULL[parseInt(mm,10)-1]} ${y}</span>
              <span class="cm2-figure"><span class="cm2-figure-label">Mensualité</span>${formatMoney(entry.mensualite)}</span>
              <span class="cm2-figure"><span class="cm2-figure-label">Capital</span>${formatMoney(entry.capital)}</span>
              <span class="cm2-figure"><span class="cm2-figure-label">Intérêts</span>${formatMoney(entry.interets)}</span>
              <span class="cm2-figure"><span class="cm2-figure-label">CRD</span>${formatMoney(entry.crd)}</span>
              <select class="cm2-statut">
                <option value="impaye" ${entry.statut==='impaye'?'selected':''}>Non payé</option>
                <option value="verse" ${entry.statut==='verse'?'selected':''}>Payé</option>
              </select>
              <input type="date" class="cm2-date" value="${esc(entry.date)}" style="${entry.statut!=='verse'?'visibility:hidden;':''}">
            </div>
          `;
        }).join('');
      }
      return `
        <div class="loyer-year-head ${expanded?'active':''}" data-credit-year-toggle="${y}">
          <span>${y}</span>
          <span class="loyer-year-count">${nbPaye}/${monthKeys.length} payées</span>
        </div>
        ${expanded ? `<div class="loyer-months">${monthsHtml}</div>` : ''}
      `;
    }).join('');
    return `
      <div style="margin-top:14px; padding-top:12px; border-top:1px solid #EDE4CC;">
        <div class="sans" style="font-size:12px; color:#948B72; margin-bottom:8px;">Tableau d'amortissement</div>
        ${yearBlocks || '<div class="gen-note" style="margin-top:0;">Aucune donnée d\'amortissement pour l\'instant.</div>'}
        <button id="add-credit-year" class="sans" style="margin-top:8px; font-size:12px; border:1px solid #DCD2B8; background:#FFFEFB; padding:6px 12px; cursor:pointer; border-radius:7px;">+ Ajouter une année</button>
      </div>
    `;
  }

  function renderLoyerRegistre(p){
    if (!p.loyer_registre) p.loyer_registre = {};
    const years = Object.keys(p.loyer_registre).sort();
    const monthNames = ['Janvier','Février','Mars','Avril','Mai','Juin','Juillet','Août','Septembre','Octobre','Novembre','Décembre'];
    let loyerRegistreHealed = false;
    const yearBlocks = years.map(y => {
      const monthsObj = p.loyer_registre[y];
      const nbVerse = Object.values(monthsObj).filter(m=>m.statut==='verse').length;
      const expanded = expandedLoyerYear === y;
      let monthsHtml = '';
      if (expanded) {
        const defaultMontant = p.loyer ? defaultMonthlyLoyer(p) : null;
        const defaultCharges = p.charges_mensuelles ? (parseNum(p.charges_mensuelles)||0) : null;
        monthsHtml = monthNames.map((name,i) => {
          const mm = String(i+1).padStart(2,'0');
          if (!monthsObj[mm]) monthsObj[mm] = {statut:'impaye', date:'', montant:'', montant_paye:'', charges:''};
          const entry = monthsObj[mm];
          if (entry.charges === undefined) { entry.charges = ''; loyerRegistreHealed = true; }
          if ((entry.statut === 'verse' || entry.statut === 'partiel') && !entry.montant && defaultMontant) {
            entry.montant = String(defaultMontant);
            loyerRegistreHealed = true;
          }
          if ((entry.statut === 'verse' || entry.statut === 'partiel') && !entry.charges && defaultCharges) {
            entry.charges = String(defaultCharges);
            loyerRegistreHealed = true;
          }
          const status = loyerRowStatus(entry, y, mm);
          const tag = status === 'future' ? ' <span class="lm-tag">en attente</span>'
            : status === 'impaye' ? ' <span class="lm-tag lm-tag-red">retard &gt; 7 j</span>'
            : status === 'attente-paiement' ? ' <span class="lm-tag">paiement attendu</span>'
            : '';
          const amounts = loyerMonthAmounts(p, entry, defaultMontant, defaultCharges);
          return `
            <div class="loyer-month-row row-${status}" data-year="${y}" data-month="${mm}">
              <span class="lm-label">${name} ${y}${tag}</span>
              <select class="lm-statut">
                <option value="impaye" ${entry.statut==='impaye'?'selected':''}>Non versé</option>
                <option value="partiel" ${entry.statut==='partiel'?'selected':''}>Partiellement versé</option>
                <option value="verse" ${entry.statut==='verse'?'selected':''}>Versé</option>
              </select>
              <input type="date" class="lm-date" value="${esc(entry.date)}" style="${entry.statut==='impaye'?'visibility:hidden;':''}">
              <input type="text" class="lm-montant" value="${esc(entry.montant)}" placeholder="${defaultMontant?formatMoney(defaultMontant):'Loyer HT'}">
              <input type="text" class="lm-charges" value="${esc(entry.charges)}" placeholder="${defaultCharges?formatMoney(defaultCharges):'Charges'}">
              <span class="lm-total">TVA ${formatMoney(amounts.tva)} · TTC ${formatMoney(amounts.totalTTC)}</span>
              <input type="text" class="lm-montant-paye" value="${esc(entry.montant_paye)}" placeholder="Montant versé (total)" style="${entry.statut!=='partiel'?'display:none;':''}">
            </div>
          `;
        }).join('');
      }
      return `
        <div class="loyer-year-head ${expanded?'active':''}" data-year-toggle="${y}">
          <span>${y}</span>
          <span class="loyer-year-count">${nbVerse}/12 versés</span>
        </div>
        ${expanded ? `<div class="loyer-months">${monthsHtml}</div>` : ''}
      `;
    }).join('');
    if (loyerRegistreHealed) scheduleSave();
    return `
      <div style="margin-top:14px; padding-top:12px; border-top:1px solid #EDE4CC;">
        <div class="sans" style="font-size:12px; color:#948B72; margin-bottom:8px;">Registre des loyers</div>
        ${yearBlocks || '<div class="gen-note" style="margin-top:0;">Aucune année suivie pour l\'instant.</div>'}
        <button id="add-loyer-year" class="sans" style="margin-top:8px; font-size:12px; border:1px solid #DCD2B8; background:#FFFEFB; padding:6px 12px; cursor:pointer; border-radius:7px;">+ Ajouter une année</button>
      </div>
    `;
  }

  function docTypeLabel(t){
    return { avis: "Avis d'échéance", quittance: 'Quittance', rappel: 'Rappel de loyer', revision: 'Révision de loyer' }[t] || t;
  }

  function renderDocHistory(p){
    const hist = (p.documents_generes || []).slice().reverse().slice(0, 10);
    if (!hist.length) return '';
    const rows = hist.map(h => `<div class="id-field"><div class="id-label">${new Date(h.date).toLocaleDateString('fr-FR')} — ${esc(docTypeLabel(h.docType))}</div><div class="id-value" style="font-size:12px; font-weight:400;">${esc(h.periode || '')}</div></div>`).join('');
    return `<div class="gen-note" style="margin-top:16px; margin-bottom:4px;">Documents générés récemment :</div><div class="id-card">${rows}</div>`;

  function docReviewCard(p){
    if (!docAnalysisResult) return '';
    const fieldsToReview = [
      ['adresse','Adresse'], ['code_postal','Code postal'], ['ville','Ville'],
      ['locataire_nom','Locataire'], ['locataire_contact','Contact / adresse locataire'],
      ['locataire_email','Email locataire'], ['locataire_telephone','Téléphone locataire'],
      ['loyer','Loyer annuel HT'], ['charges_mensuelles','Charges mensuelles'], ['echeance','Fréquence de paiement'],
      ['bail_duree','Durée du bail'], ['bail_date_signature',"Date de prise d'effet"], ['bail_signataires','Signataires'],
      ['bail_loyer_mensuel','Loyer mensuel (bail)'], ['bail_franchise','Franchise de loyer'],
      ['bail_depot_garantie','Dépôt de garantie'], ['bail_droit_entree',"Droit d'entrée"],
      ['bail_surface','Surface'], ['bail_tva','TVA'],
      ['revision_indice_type', "Type d'indice (révision)"], ['revision_indice_valeur','Indice de base — valeur'],
      ['revision_indice_trimestre','Indice de base — trimestre'], ['revision_date_prochaine','Prochaine révision'],
      ['credit_banque','Banque'], ['credit_numero','Numéro de prêt'], ['credit_montant','Montant emprunté'],
      ['credit_taux','Taux débiteur'], ['credit_teg','TEG'], ['credit_duree_mois','Durée du prêt (mois)'],
      ['credit_date_depart','Date de départ du prêt'], ['credit_mensualite','Mensualité'],
      ['credit_frais_dossier','Frais de dossier'], ['credit_frais_garantie','Frais de garantie'], ['credit_type_garantie','Type de garantie'],
      ['prix_achat',"Prix d'achat"], ['date_acquisition',"Date d'acquisition"], ['frais_agence',"Frais d'agence"], ['frais_notaire','Frais de notaire'], ['valeur','Valeur estimée'],
      ['assurance_nom','Assureur'], ['assurance_police','N° de police'],
      ['syndic_nom','Syndic'], ['syndic_contact','Contact syndic'], ['charges_copro','Charges de copro (an)'],
      ['taxe_fonciere_montant','Taxe foncière — montant']
    ];
    // On ne propose que ce qui apporte vraiment quelque chose : un champ vide
    // que le document permet de remplir, ou un champ déjà rempli mais dont la
    // valeur trouvée diffère de ce qui est enregistré (à arbitrer).
    const norm = v => (v===undefined || v===null) ? '' : String(v).trim();
    const rows = fieldsToReview.map(([key,label]) => {
      const found = docAnalysisResult[key];
      if (found === undefined || found === null || norm(found) === '') return '';
      const current = norm(p[key]);
      const foundNorm = norm(found);
      if (current === '') {
        return `<div class="row"><div class="k">${label}</div><div class="v"><input data-review-field="${key}" value="${esc(found)}"></div></div>`;
      }
      if (current !== foundNorm) {
        return `<div class="row"><div class="k">${label}<div style="font-size:11px; font-weight:400; color:#948B72; margin-top:2px;">actuel : ${esc(current)}</div></div><div class="v"><input data-review-field="${key}" value="${esc(found)}"></div></div>`;
      }
      return ''; // déjà identique — inutile de le proposer
    }).join('');
    const hasRows = rows.trim() !== '';
    return `
      <div class="id-card" style="margin-top:14px; border:1px solid #2E6B48; border-radius:10px; padding:14px;">
        <div class="gen-note" style="margin-top:0;">${hasRows ? 'Vérifiez les informations trouvées avant de les appliquer :' : 'Le document a été analysé, mais tout ce qui a été trouvé correspond déjà à la fiche.'}</div>
        ${rows}
        <div style="display:flex; gap:8px; margin-top:8px;">
          ${hasRows ? `<button id="doc-review-apply" class="sans" style="border:none; background:#2E6B48; color:#FBF7EE; font-size:13px; padding:9px 16px; cursor:pointer; border-radius:8px;">Appliquer</button>` : ''}
          <button id="doc-review-cancel" class="sans" style="border:1px solid #DCD2B8; background:none; color:#1C2333; font-size:13px; padding:9px 16px; cursor:pointer; border-radius:8px;">${hasRows ? 'Annuler' : 'Fermer'}</button>
        </div>
      </div>
    `;
  }

          linkHtml = dl
            ? `<a href="${esc(dl)}" style="color:#1C2333;">Télécharger ⬇</a>`
            : `<a href="${esc(d.lien)}" target="_blank" style="color:#1C2333;">Ouvrir le lien ↗</a>`;
        }
        return `<div class="id-field"><div class="id-label">${esc(d.label)||'Document'}</div><div class="id-value">${linkHtml}</div></div>`;
      }).join('');
      return tabHeader() + (p.documents.length ? `<div class="id-card">${cards}</div>` : `<div class="gen-note">Aucun document.</div>`);
    }
    if (tab === 'generation') {
      const sci = scis.find(s => s.id === p.sci_id) || {};
      const now = new Date();
      const currentYear = now.getFullYear();
      const currentMonth = now.getMonth()+1;
      if (genYear === null) genYear = currentYear;
      if (genPeriodType === null) genPeriodType = (p.echeance||'').toLowerCase().indexOf('trimestriel') !== -1 ? 'trimestre' : 'mois';
      if (genMonth === null) genMonth = String(currentMonth).padStart(2,'0');
      if (genQuarter === null) genQuarter = monthToQuarter(currentMonth);

      const missingEmail = !p.locataire_email;
      const typeSelectHtml = `
        <select id="gen-type">
          <option value="avis" ${genDocType==='avis'?'selected':''}>Avis d'échéance</option>
          <option value="quittance" ${genDocType==='quittance'?'selected':''}>Quittance</option>
          <option value="rappel" ${genDocType==='rappel'?'selected':''}>Rappel de loyer</option>
          <option value="revision" ${genDocType==='revision'?'selected':''}>Révision de loyer</option>
        </select>
      `;
      const historyHtml = renderDocHistory(p);

      if (genDocType === 'revision') {
        const rev = p.derniere_revision;
        if (!rev) {
          return `
            <div class="gen-row">${typeSelectHtml}</div>
            <div class="gen-note" style="color:#B0452E;">Aucune révision enregistrée pour ce bien. Faites d'abord "Faire la révision du loyer" dans l'onglet Loyer.</div>
            ${historyHtml}
          `;
        }
        return `
          <div class="gen-row">${typeSelectHtml}</div>
          <div class="id-card" style="margin-top:10px;">
            <div class="id-field"><div class="id-label">Date d'effet</div><div class="id-value">${new Date(rev.date_effet).toLocaleDateString('fr-FR')}</div></div>
            <div class="id-field"><div class="id-label">Ancien loyer</div><div class="id-value">${formatMoney(rev.ancien_loyer)}</div></div>
            <div class="id-field"><div class="id-label">Nouveau loyer</div><div class="id-value">${formatMoney(rev.nouveau_loyer)}</div></div>
            <div class="id-field"><div class="id-label">Indice (${esc(rev.indice_type)})</div><div class="id-value" style="font-size:13px;">${esc(rev.ancien_indice_valeur)} (${esc(rev.ancien_indice_trimestre)}) → ${esc(rev.nouvel_indice_valeur)} (${esc(rev.nouvel_indice_trimestre)})</div></div>
          </div>
          ${missingEmail ? `<div class="gen-note" style="color:#B0452E;">Aucun email locataire renseigné (onglet Locataire) — impossible de générer le brouillon.</div>` : ''}
          ${!sci.email_envoi ? `<div class="gen-note">Aucun email d'envoi personnalisé pour cette SCI — le brouillon partira de votre adresse Gmail principale.</div>` : ''}
          <button id="gen-submit-btn" class="sans" ${missingEmail?'disabled':''} style="margin-top:6px; border:none; background:#1C2333; color:#FBF7EE; font-size:13px; padding:10px 18px; cursor:${missingEmail?'not-allowed':'pointer'}; border-radius:8px; opacity:${missingEmail?'0.5':'1'};">${genBusy ? 'Génération en cours…' : 'Générer le document et le brouillon Gmail'}</button>
          ${genMessage ? `<div class="gen-note">${esc(genMessage)}</div>` : ''}
        ${genDraftUrl ? `<div class="gen-note"><a href="${esc(genDraftUrl)}" target="_blank" style="color:#1C2333; font-weight:600;">Ouvrir le brouillon Gmail →</a></div>` : ''}
          ${historyHtml}
        `;
      }

      const effectivePeriodType = genDocType === 'rappel' ? 'mois' : genPeriodType;
      const monthOrQuarter = effectivePeriodType === 'trimestre' ? genQuarter : genMonth;
      const amounts = computePeriodAmounts(p, effectivePeriodType, genYear, monthOrQuarter);
      const label = periodLabel(effectivePeriodType, genYear, monthOrQuarter);

      const yearsOptions = [currentYear-1, currentYear, currentYear+1].map(y=>`<option value="${y}" ${String(y)===String(genYear)?'selected':''}>${y}</option>`).join('');
      const monthOptions = MONTH_NAMES_FULL.map((name,i)=>{
        const mm = String(i+1).padStart(2,'0');
        return `<option value="${mm}" ${mm===genMonth?'selected':''}>${name}</option>`;
      }).join('');
      const quarterOptions = [1,2,3,4].map(q=>`<option value="${q}" ${String(q)===String(genQuarter)?'selected':''}>${q}e trimestre</option>`).join('');

      const warnPaiement = (genDocType === 'quittance' && amounts.anyData && !amounts.allVerse);

      return `
        <div class="gen-row">
          ${typeSelectHtml}
          ${genDocType !== 'rappel' ? `
            <select id="gen-period-type">
              <option value="mois" ${effectivePeriodType==='mois'?'selected':''}>Un mois</option>
              <option value="trimestre" ${effectivePeriodType==='trimestre'?'selected':''}>Un trimestre</option>
            </select>
          ` : ''}
          <select id="gen-year">${yearsOptions}</select>
          ${effectivePeriodType === 'trimestre'
            ? `<select id="gen-quarter">${quarterOptions}</select>`
            : `<select id="gen-month">${monthOptions}</select>`}
        </div>
        <div class="id-card" style="margin-top:10px;">
          <div class="id-field"><div class="id-label">Période</div><div class="id-value">${esc(label)}</div></div>
          <div class="id-field"><div class="id-label">Loyer HT</div><div class="id-value">${formatMoney(amounts.loyerHT)}</div></div>
          <div class="id-field"><div class="id-label">Charges</div><div class="id-value">${formatMoney(amounts.charges)}</div></div>
          <div class="id-field"><div class="id-label">TVA</div><div class="id-value">${formatMoney(amounts.tva)}</div></div>
          <div class="id-field"><div class="id-label">Total TTC</div><div class="id-value">${formatMoney(amounts.totalTTC)}</div></div>
        </div>
        ${warnPaiement ? `<div class="gen-note" style="color:#B0452E;">Attention : tous les mois de cette période ne sont pas marqués "Versé" dans le registre des loyers.</div>` : ''}
        ${missingEmail ? `<div class="gen-note" style="color:#B0452E;">Aucun email locataire renseigné (onglet Locataire) — impossible de générer le brouillon.</div>` : ''}
        ${!sci.email_envoi ? `<div class="gen-note">Aucun email d'envoi personnalisé pour cette SCI — le brouillon partira de votre adresse Gmail principale (configurable dans la fiche SCI).</div>` : ''}
        <button id="gen-submit-btn" class="sans" ${missingEmail?'disabled':''} style="margin-top:6px; border:none; background:#1C2333; color:#FBF7EE; font-size:13px; padding:10px 18px; cursor:${missingEmail?'not-allowed':'pointer'}; border-radius:8px; opacity:${missingEmail?'0.5':'1'};">${genBusy ? 'Génération en cours…' : 'Générer le document et le brouillon Gmail'}</button>
        ${genMessage ? `<div class="gen-note">${esc(genMessage)}</div>` : ''}
        ${genDraftUrl ? `<div class="gen-note"><a href="${esc(genDraftUrl)}" target="_blank" style="color:#1C2333; font-weight:600;">Ouvrir le brouillon Gmail →</a></div>` : ''}
        ${historyHtml}
      `;
    }
    return '';
  }

  function renderOverviewPanel(){
    const totalValeur = properties.reduce((s,p) => s + (parseNum(p.valeur) || 0), 0);
    const totalLoyer = properties.reduce((s,p) => s + (parseNum(p.loyer) || 0), 0);
    const loyerAlerts = getLoyerAlerts(properties);
    const nbLate = new Set(loyerAlerts.map(a => a.prop.id)).size || properties.filter(p => p.statut_paiement === 'late').length;
    const alerts = getAlerts(properties);

    const hero = `
      <div class="hero-stats">
        <div class="hero-stat">
          <div class="hero-stat-label">Valeur totale du portefeuille</div>
          <div class="hero-stat-value">${totalValeur ? totalValeur.toLocaleString('fr-FR') + ' €' : '—'}</div>
        </div>
        <div class="hero-stat">
          <div class="hero-stat-label">Loyers annuels cumulés</div>
          <div class="hero-stat-value">${totalLoyer ? totalLoyer.toLocaleString('fr-FR') + ' €' : '—'}</div>
        </div>
      </div>
    `;

    const metrics = `
      <div class="metric-grid">
        <div class="metric-card"><div class="m-label">Biens suivis</div><div class="m-value">${properties.length}</div></div>
        <div class="metric-card ${nbLate?'warn':''}"><div class="m-label">Impayés</div><div class="m-value">${nbLate}</div></div>
      </div>
    `;

    const loyerAlertsHtml = loyerAlerts.map(a => `<div class="alert-row urgent">${a.text}</div>`).join('');
    const echAlertsHtml = alerts.map(a => `<div class="alert-row ${a.days<=7?'urgent':''}">${alertText(a)}</div>`).join('');
    const alertsHtml = (loyerAlertsHtml + echAlertsHtml) || `<div class="gen-note">Aucune échéance dans les 90 prochains jours.</div>`;

    const listHtml = properties.map(p => `
      <div class="pl-row" data-goto="${p.id}">
        ${p.photo_url ? `<img class="facade-thumb" src="${esc(p.photo_url)}" onerror="this.outerHTML='<div class=facade-thumb-empty></div>'">` : `<div class="facade-thumb-empty"></div>`}
        <span class="index-status ${statusDot(computePaymentStatus(p).key)}"></span>
        <span class="pl-name">${esc(propLabel(p))}<div class="pl-sub">${esc(sciName(p.sci_id))}</div></span>
      </div>
    `).join('');

    return `
      <h2>Vue d'ensemble du portefeuille</h2>
      <div class="addr-city">${scis.length} SCI — ${properties.length} biens</div>
      ${hero}
      ${metrics}
      ${sectionHeader('Échéances à venir')}
      <div class="panel">${alertsHtml}</div>
      ${sectionHeader('Tous les biens')}
      <div class="panel portfolio-list">${listHtml}</div>
    `;
  }

  function renderSciPanel(sci){
    const items = properties.filter(p => p.sci_id === sci.id);

    const identityContent = sciEditMode ? `
      <div class="row"><div class="k">SIREN</div><div class="v"><input data-sf="siren" value="${esc(sci.siren)}" placeholder="ex. 123 456 789"></div></div>
      <div class="row"><div class="k">Adresse du siège</div><div class="v"><input data-sf="adresse_siege" value="${esc(sci.adresse_siege)}"></div></div>
      <div class="row"><div class="k">Gérant</div><div class="v"><input data-sf="gerant" value="${esc(sci.gerant)}"></div></div>
      <div class="row"><div class="k">Date de création</div><div class="v"><input type="date" data-sf="date_creation" value="${esc(sci.date_creation)}"></div></div>
      <div class="row"><div class="k">Email d'envoi (alias Gmail)</div><div class="v"><input data-sf="email_envoi" value="${esc(sci.email_envoi)}" placeholder="ex. contact@sci-xxx.fr"></div></div>
      <div class="row"><div class="k">Emails en copie (CC)</div><div class="v"><input data-sf="email_cc" value="${esc(sci.email_cc)}" placeholder="ex. kevin@..., benjamin@..."></div></div>
      <div class="row"><div class="k">Associés</div><div class="v"><textarea data-sf="associes">${esc(sci.associes)}</textarea></div></div>
      <div class="row"><div class="k">Notes</div><div class="v"><textarea data-sf="notes" placeholder="Notes libres sur la SCI">${esc(sci.notes)}</textarea></div></div>
    ` : `
      <div class="id-card">
        <div class="id-field"><div class="id-label">SIREN</div><div class="id-value">${esc(sci.siren)||'—'}</div></div>
        <div class="id-field"><div class="id-label">Adresse du siège</div><div class="id-value">${esc(sci.adresse_siege)||'—'}</div></div>
        <div class="id-field"><div class="id-label">Gérant</div><div class="id-value">${esc(sci.gerant)||'—'}</div></div>
        <div class="id-field"><div class="id-label">Date de création</div><div class="id-value">${sci.date_creation ? new Date(sci.date_creation).toLocaleDateString('fr-FR') : '—'}</div></div>
        <div class="id-field"><div class="id-label">Email d'envoi</div><div class="id-value">${esc(sci.email_envoi)||'—'}</div></div>
        <div class="id-field"><div class="id-label">Emails en copie</div><div class="id-value">${esc(sci.email_cc)||'—'}</div></div>
      </div>
      ${sectionHeader('Associés')}
      <div class="id-text">${esc(sci.associes)||'—'}</div>
      ${sectionHeader('Notes')}
      <div class="id-text">${esc(sci.notes)||'—'}</div>
    `;

    return `
      <div style="display:flex; justify-content:space-between; align-items:baseline; margin-bottom:4px;">
        <div>
          <h2>${esc(sci.nom)}</h2>
          <div class="addr-city">${items.length} bien${items.length>1?'s':''} rattaché${items.length>1?'s':''}</div>
        </div>
        <div style="display:flex; gap:8px; align-items:center;">
          <button id="sci-rename-btn" class="sans" style="border:none; background:none; color:#948B72; font-size:12px; cursor:pointer; text-decoration:underline;">Renommer</button>
          <button id="sci-delete-btn" class="sans" style="border:none; background:none; color:#D2543B; font-size:12px; cursor:pointer; text-decoration:underline;">Supprimer</button>
          ${editToggleButton(sciEditMode, 'sci-edit-toggle')}
        </div>
      </div>

      <div class="panel">${identityContent}</div>

      ${sectionHeader('Actifs de la SCI')}
      <div class="panel portfolio-list">
        ${items.map(p => `
          <div class="pl-row" data-goto="${p.id}">
            ${p.photo_url ? `<img class="facade-thumb" src="${esc(p.photo_url)}" onerror="this.outerHTML='<div class=facade-thumb-empty></div>'">` : `<div class="facade-thumb-empty"></div>`}
            <span class="index-status ${statusDot(computePaymentStatus(p).key)}"></span>
            <span class="pl-name">${esc(propLabel(p))}</span>
          </div>
        `).join('') || '<div class="gen-note">Aucun bien rattaché.</div>'}
      </div>

      ${sciEditMode ? `
      <div class="toolbar">
        <button class="primary" id="save-sci-btn">Enregistrer</button>
        <span class="save-flag" id="save-flag"></span>
      </div>` : ''}
    `;
  }

  function render(){
    const app = document.getElementById('sci-app');
    if (loadError) {
      app.innerHTML = `<div style="padding:28px; font-family:-apple-system,sans-serif; color:#8a3324; line-height:1.5;">
        <strong>Erreur de chargement des données du registre.</strong><br><br>
        Par sécurité, aucune modification ne peut être enregistrée tant que le chargement n'a pas réussi — cela évite d'écraser vos données existantes avec un état vide.<br><br>
        Rechargez la page. Si le problème persiste, attendez une minute puis réessayez.
      </div>`;
      return;
    }
    const p = properties.find(x => x.id === selectedId);
    const sci = scis.find(x => x.id === selectedSciId);
    const globalAlerts = getAlerts(properties);
    const globalLoyerAlerts = getLoyerAlerts(properties);
    const urgentCount = globalAlerts.filter(a => a.days <= 30).length + globalLoyerAlerts.length;

    let indexHtml = `<div class="overview-btn ${viewMode==='overview'?'active':''}" id="go-overview">Vue d'ensemble</div>`;
    indexHtml += `<input id="sidebar-search" type="text" class="sidebar-search-input" placeholder="Rechercher un bien..." value="${esc(sidebarSearch)}">`;
    const searchActive = sidebarSearch.trim().length > 0;
    const searchLower = sidebarSearch.trim().toLowerCase();
    scis.forEach(s => {
      const allItems = properties.filter(pr => pr.sci_id === s.id);
      const items = searchActive ? allItems.filter(pr => propLabel(pr).toLowerCase().includes(searchLower)) : allItems;
      if (searchActive && items.length === 0) return;
      const expanded = searchActive || (viewMode==='sci' && selectedSciId===s.id) || (viewMode==='detail' && p && p.sci_id===s.id);
      indexHtml += `
        <div class="sci-group-head ${viewMode==='sci' && s.id===selectedSciId?'active':''}" data-sci-id="${s.id}">
          <span class="sci-group-name">${esc(s.nom)}</span>
          <span class="sci-group-count">${items.length}</span>
        </div>
      `;
      if (expanded) {
        items.forEach(prop => {
          const noEmail = !prop.locataire_email;
          indexHtml += `
            <div class="index-item ${viewMode==='detail' && prop.id===selectedId?'active':''}" data-id="${prop.id}">
              <span class="index-label">${esc(propLabel(prop))}${noEmail ? ' <span title="Email locataire manquant" style="color:#B0452E; font-size:11px;">✉︎!</span>' : ''}</span>
              <span class="index-status ${statusDot(computePaymentStatus(prop).key)}"></span>
            </div>
          `;
        });
      }
    });
    indexHtml += `<button class="add-sci" id="add-sci">+ Ajouter une SCI</button>`;
    if (scis.length) indexHtml += `<button class="add-item" id="add-prop">+ Ajouter un bien</button>`;

    let detailHtml = '';
    if (viewMode === 'overview') {
      detailHtml = renderOverviewPanel();
    } else if (viewMode === 'sci') {
      detailHtml = sci ? renderSciPanel(sci) : `<div class="empty">SCI introuvable.</div>`;
    } else if (!p) {
      detailHtml = `<div class="empty">Sélectionnez un bien, ou ajoutez une SCI puis un bien.</div>`;
    } else {
      const facadeHtml = `
        <div class="facade-upload-wrap" style="position:relative;">
          ${p.photo_url
            ? `<img class="facade" src="${esc(p.photo_url)}" alt="Façade de ${esc(propLabel(p))}" onerror="this.outerHTML='<div class=facade-empty>Lien image invalide</div>'">`
            : `<label class="facade-empty" style="cursor:pointer;">Aucune photo — cliquez pour en ajouter une<input type="file" accept="image/*" data-facade-upload="photo_url" style="display:none;"></label>`}
          ${p.photo_url ? `
            <div style="position:absolute; top:8px; right:8px; display:flex; gap:6px;">
              <label class="sans" style="font-size:11px; background:rgba(28,35,51,0.85); color:#FBF7EE; padding:5px 10px; border-radius:6px; cursor:pointer;">
                Changer
                <input type="file" accept="image/*" data-facade-upload="photo_url" style="display:none;">
              </label>
              <button type="button" data-facade-remove="photo_url" class="sans" style="font-size:11px; background:rgba(178,69,46,0.9); color:#FBF7EE; border:none; padding:5px 10px; border-radius:6px; cursor:pointer;">Retirer</button>
            </div>
          ` : ''}
        </div>
      `;

      const propAlerts = getAlerts([p]);
      const propLoyerAlerts = getLoyerAlerts([p]);
      const bannerHtml = propLoyerAlerts.map(a => `<div class="alert-row urgent">${a.text}</div>`).join('')
        + propAlerts.map(a => `<div class="alert-row ${a.days<=7?'urgent':''}">${alertText(a)}</div>`).join('');
      const alertBanner = bannerHtml ? `<div class="alert-banner">${bannerHtml}</div>` : '';

      const tabsHtml = TABS.map(t => `<button class="tab-btn ${openTab===t.id?'active':''}" style="--tab-color:${t.color}" data-tab="${t.id}"><span class="icon">${ICONS[t.id]}</span>${t.label}</button>`).join('');
      const panel = openTab ? `<div class="panel">${panelHtml(p, openTab)}</div>` : '';

      detailHtml = `
        ${facadeHtml}
        <h2>${esc(propLabel(p))}</h2>
        <div class="addr-city">${esc(sciName(p.sci_id))}</div>
        ${alertBanner}
        <div class="overview">
          <div class="ov-item"><div class="ov-label">Prix d'achat (coût total)</div><div class="ov-value">${(() => {
            const cout = (parseNum(p.prix_achat)||0) + (parseNum(p.frais_agence)||0) + (parseNum(p.frais_notaire)||0);
            return cout ? formatMoney(cout) : '—';
          })()}</div></div>
          <div class="ov-item"><div class="ov-label">Valeur estimée</div><div class="ov-value">${formatMoney(p.valeur)}</div></div>
          <div class="ov-item"><div class="ov-label">Locataire</div><div class="ov-value">${esc(p.locataire_nom)||'—'}</div></div>
          <div class="ov-item"><div class="ov-label">Loyer annuel</div><div class="ov-value">${p.loyer ? formatMoney(p.loyer) + ' <span style="font-size:13px; font-weight:400; color:#948B72;">HT HC</span>' : '—'}</div></div>
          <div class="ov-item"><div class="ov-label">Prix au m² (valeur estimée)</div><div class="ov-value">${(() => {
            const surface = parseNum(p.bail_surface);
            const val = parseNum(p.valeur);
            return (surface && val) ? formatMoney(Math.round(val/surface)) + '/m²' : '—';
          })()}</div></div>
          <div class="ov-item"><div class="ov-label">Rentabilité nette</div><div class="ov-value">${(() => {
            const cout = (parseNum(p.prix_achat)||0) + (parseNum(p.frais_agence)||0) + (parseNum(p.frais_notaire)||0);
            const l = parseNum(p.loyer);
            if (!cout || !l) return '—';
            const pct = l/cout*100;
            const color = pct >= 6 ? '#2E6B48' : (pct >= 4 ? '#C9711F' : '#D2543B');
            return `<span style="color:${color};">${pct.toLocaleString('fr-FR',{maximumFractionDigits:1})} %</span>`;
          })()}</div></div>
          <div class="ov-item"><div class="ov-label">Statut de paiement</div><div class="ov-value badge"><span class="dot ${statusDot(computePaymentStatus(p).key)}"></span>${computePaymentStatus(p).label}</div></div>
        </div>

        <div class="tabs">${tabsHtml}</div>
        ${panel}

        <div class="toolbar">
          <button class="primary" id="save-btn">Enregistrer maintenant</button>
          <button id="del-btn">Supprimer ce bien</button>
          <span class="save-flag" id="save-flag"></span>
          <span class="gen-note" style="margin:0;">Sauvegarde automatique activée</span>
        </div>
      `;
    }

    app.innerHTML = `
      <div class="frame">
        <div class="masthead">
          <div>
            <h1>Registre des actifs immobiliers</h1>
            <div class="sub">${properties.length} bien${properties.length>1?'s':''} — ${scis.length} SCI</div>
          </div>
          ${urgentCount ? `<span class="alert-pill">${urgentCount} échéance${urgentCount>1?'s':''} à 30 j</span>` : ''}
        </div>
        <div class="body">
          <div class="index">${indexHtml}</div>
          <div class="detail">${detailHtml}</div>
        </div>
        <div class="foot">
          <span>Lien partagé — toute personne qui l'ouvre peut voir et modifier ces données.</span>
          <span class="foot-backup">
            <button id="export-btn" title="Exporter une sauvegarde locale">Exporter</button> ·
            <button id="import-btn" title="Importer une sauvegarde locale">Importer</button>
            <input type="file" id="import-file" accept="application/json" style="display:none;">
          </span>
        </div>
      </div>
    `;

    const goOverview = document.getElementById('go-overview');
    if (goOverview) goOverview.addEventListener('click', () => { viewMode = 'overview'; render(); });

    app.querySelectorAll('.copy-field-btn').forEach(el => {
      el.addEventListener('click', () => {
        const val = el.dataset.copyValue;
        const flash = () => {
          const flag = document.getElementById('save-flag');
          if (flag) { flag.textContent = 'Copié'; setTimeout(()=>{ if(flag) flag.textContent=''; }, 1500); }
        };
        if (navigator.clipboard && navigator.clipboard.writeText) {
          navigator.clipboard.writeText(val).then(flash).catch(()=>{ window.prompt('Copiez :', val); });
        } else {
          window.prompt('Copiez :', val);
        }
      });
    });

    const searchInput = document.getElementById('sidebar-search');
    if (searchInput) searchInput.addEventListener('input', () => {
      sidebarSearch = searchInput.value;
      const cursorPos = searchInput.selectionStart;
      render();
      const newInput = document.getElementById('sidebar-search');
      if (newInput) { newInput.focus(); newInput.setSelectionRange(cursorPos, cursorPos); }
    });

    app.querySelectorAll('[data-facade-upload]').forEach(el => {
      el.addEventListener('change', async () => {
        const file = el.files[0];
        if (!file) return;
        if (file.size > 15 * 1024 * 1024) {
          alert('Image trop lourde (max 15 Mo).');
          return;
        }
        const field = el.dataset.facadeUpload;
        try {
          p[field] = await resizeImageForStorage(file, 1200, 0.82);
          save();
          render();
        } catch(e) {
          alert("Erreur lors du traitement de l'image : " + e.message);
        }
      });
    });
    app.querySelectorAll('[data-facade-remove]').forEach(el => {
      el.addEventListener('click', () => { p[el.dataset.facadeRemove] = ''; save(); render(); });
    });

    const exportBtn = document.getElementById('export-btn');
    if (exportBtn) exportBtn.addEventListener('click', () => {
      const data = JSON.stringify({ scis, properties }, null, 2);
      const blob = new Blob([data], { type: 'application/json' });
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      const date = new Date().toISOString().slice(0,10);
      a.href = url;
      a.download = `registre-actifs-sauvegarde-${date}.json`;
      document.body.appendChild(a);
      a.click();
      document.body.removeChild(a);
      URL.revokeObjectURL(url);
    });

    const importBtn = document.getElementById('import-btn');
    const importFile = document.getElementById('import-file');
    if (importBtn && importFile) {
      importBtn.addEventListener('click', () => importFile.click());
      importFile.addEventListener('change', (e) => {
        const file = e.target.files[0];
        if (!file) return;
        const reader = new FileReader();
        reader.onload = (ev) => {
          try {
            const parsed = JSON.parse(ev.target.result);
            if (!parsed.scis || !parsed.properties) throw new Error('Format invalide');
            if (!window.confirm('Remplacer les données actuelles par celles de ce fichier ?')) return;
            scis = parsed.scis;
            properties = parsed.properties;
            touchedSciIds = new Set(scis.map(s => s.id));
            touchedPropertyIds = new Set(properties.map(pr => pr.id));
            selectedId = null;
            selectedSciId = null;
            viewMode = 'overview';
            save();
            render();
          } catch (err) {
            alert('Fichier invalide ou illisible : ' + err.message);
          }
        };
        reader.readAsText(file);
      });
    }

    app.querySelectorAll('.sci-group-head').forEach(el => {
      el.addEventListener('click', () => { selectedSciId = el.dataset.sciId; touchedSciIds.add(selectedSciId); viewMode = 'sci'; sciEditMode = false; render(); });
    });

    app.querySelectorAll('.index-item').forEach(el => {
      el.addEventListener('click', () => { selectedId = el.dataset.id; touchedPropertyIds.add(selectedId); selectedSciId = properties.find(x=>x.id===el.dataset.id).sci_id; viewMode = 'detail'; openTab = null; tabEditMode = false; expandedLoyerYear = null; expandedCreditYear = null; genPeriodType = null; genYear = null; genMonth = null; genQuarter = null; genMessage = ''; genDraftUrl = null; revisionFormOpen = false; docAnalysisResult = null; docAnalysisError = ''; render(); });
    });

    app.querySelectorAll('.pl-row').forEach(el => {
      el.addEventListener('click', () => { selectedId = el.dataset.goto; touchedPropertyIds.add(selectedId); viewMode = 'detail'; openTab = null; render(); });
    });

    app.querySelectorAll('.tab-btn').forEach(el => {
      el.addEventListener('click', () => { openTab = (openTab === el.dataset.tab) ? null : el.dataset.tab; tabEditMode = false; expandedLoyerYear = null; expandedCreditYear = null; docAnalysisResult = null; docAnalysisError = ''; render(); });
    });

    const addSciBtn = document.getElementById('add-sci');
    if (addSciBtn) addSciBtn.addEventListener('click', () => {
      const nom = window.prompt('Nom de la nouvelle SCI :', '');
      if (!nom) return;
      const ns = { id: uid('sci'), nom: nom, siren:'', adresse_siege:'', gerant:'', date_creation:'', associes: '', notes: '', email_envoi: '', email_cc: '' };
      scis.push(ns);
      touchedSciIds.add(ns.id);
      save();
      render();
    });

    const addPropBtn = document.getElementById('add-prop');
    if (addPropBtn) addPropBtn.addEventListener('click', () => {
      let targetSci = scis[0].id;
      if (viewMode === 'sci' && selectedSciId) targetSci = selectedSciId;
      else if (viewMode === 'detail' && p) targetSci = p.sci_id;
      const np = blankProp(targetSci);
      properties.push(np);
      touchedPropertyIds.add(np.id);
      selectedId = np.id;
      selectedSciId = targetSci;
      viewMode = 'detail';
      openTab = 'identification';
      scheduleSave();
      render();
    });

    if (viewMode === 'sci' && sci) {
      app.querySelectorAll('[data-sf]').forEach(el => {
        el.addEventListener('input', () => { sci[el.dataset.sf] = el.value; scheduleSave(); });
        el.addEventListener('blur', () => { save(); });
      });
      const saveSciBtn = document.getElementById('save-sci-btn');
      if (saveSciBtn) saveSciBtn.addEventListener('click', save);

      const renameBtn = document.getElementById('sci-rename-btn');
      if (renameBtn) renameBtn.addEventListener('click', () => {
        const val = window.prompt('Nouveau nom de la SCI :', sci.nom);
        if (val) { sci.nom = val; save(); render(); }
      });

      const deleteSciBtn = document.getElementById('sci-delete-btn');
      if (deleteSciBtn) deleteSciBtn.addEventListener('click', async () => {
        const attached = properties.filter(x => x.sci_id === sci.id);
        if (attached.length) {
          alert(`Impossible : ${attached.length} bien(s) encore rattaché(s) à cette SCI. Déplacez-les ou supprimez-les d'abord (onglet Identification de chaque bien).`);
          return;
        }
        if (!window.confirm(`Supprimer définitivement la SCI "${sci.nom}" ? Cette action est irréversible.`)) return;
        deleteSciBtn.disabled = true;
        deleteSciBtn.textContent = 'Suppression…';
        deletedSciIds.push(sci.id);
        const savedScis = scis;
        scis = scis.filter(s => s.id !== sci.id);
        const ok = await save();
        if (ok) {
          selectedSciId = null;
          viewMode = 'overview';
        } else {
          deletedSciIds = deletedSciIds.filter(id => id !== sci.id);
          scis = savedScis;
          window.alert(`Échec de la suppression de la SCI "${sci.nom}" (problème réseau ou serveur). Réessayez.`);
        }
        render();
      });
    }

    const sciEditToggle = document.getElementById('sci-edit-toggle');
    if (sciEditToggle) sciEditToggle.addEventListener('click', () => {
      if (sciEditMode) save();
      sciEditMode = !sciEditMode;
      render();
    });

    if (viewMode==='detail' && p && openTab) {
      app.querySelectorAll('[data-f]').forEach(el => {
        el.addEventListener('input', () => { p[el.dataset.f] = el.value; scheduleSave(); });
        el.addEventListener('blur', () => { save(); });
        el.addEventListener('change', () => { p[el.dataset.f] = el.value; scheduleSave(); if (el.dataset.f === 'sci_id' || el.dataset.f === 'photo_url') render(); });
      });
      app.querySelectorAll('.doc-label').forEach((el,i) => {
        el.addEventListener('input', () => { p.documents[i].label = el.value; scheduleSave(); });
      });
      app.querySelectorAll('.doc-lien').forEach((el,i) => {
        el.addEventListener('input', () => { p.documents[i].lien = el.value; scheduleSave(); });
      });
      app.querySelectorAll('.doc-del').forEach((el,i) => {
        el.addEventListener('click', () => { p.documents.splice(i,1); scheduleSave(); render(); });
      });
      const addDoc = document.getElementById('add-doc');
      if (addDoc) addDoc.addEventListener('click', () => { p.documents.push({label:'', lien:''}); scheduleSave(); render(); });

      app.querySelectorAll('[data-photo-upload]').forEach(el => {
        el.addEventListener('change', async () => {
          const file = el.files[0];
          if (!file) return;
          if (file.size > 15 * 1024 * 1024) {
            alert('Image trop lourde (max 15 Mo). Vous pouvez aussi coller un lien Drive.');
            return;
          }
          const field = el.dataset.photoUpload;
          try {
            p[field] = await resizeImageForStorage(file, 1200, 0.82);
            save();
            render();
          } catch(e) {
            alert("Erreur lors du traitement de l'image : " + e.message);
          }
        });
      });
      app.querySelectorAll('[data-photo-remove]').forEach(el => {
        el.addEventListener('click', () => {
          p[el.dataset.photoRemove] = '';
          save();
          render();
        });
      });

      const tabEditToggle = document.getElementById('tab-edit-toggle');
      if (tabEditToggle) tabEditToggle.addEventListener('click', () => {
        if (tabEditMode) save();
        tabEditMode = !tabEditMode;
        render();
      });

      if (openTab === 'documents') {
        app.querySelectorAll('.doc-analyze-input').forEach(el => {
          el.addEventListener('change', () => {
            const file = el.files[0];
            if (!file) return;
            if (file.size > 45 * 1024 * 1024) {
              docAnalysisError = 'Fichier trop volumineux (max 45 Mo).';
              render();
              return;
            }
            const reader = new FileReader();
            reader.onload = async () => {
              const base64 = reader.result.split(',')[1];
              docAnalysisBusy = true; docAnalysisError = ''; docAnalysisResult = null; render();
              try {
                const res = await fetch(BACKEND_URL, {
                  method: 'POST',
                  body: JSON.stringify({ key: API_KEY, action: 'analyzeDocument', fileBase64: base64, mimeType: file.type || 'application/pdf' })
                });
                const data = await res.json();
                if (data.error) { docAnalysisError = 'Erreur : ' + data.error; }
                else { docAnalysisResult = data.extracted || {}; }
              } catch(e) {
                docAnalysisError = 'Erreur réseau : ' + e.message;
              }
              docAnalysisBusy = false;
              render();
            };
            reader.readAsDataURL(file);
          });
        });

        const docApplyBtn = document.getElementById('doc-review-apply');
        if (docApplyBtn) docApplyBtn.addEventListener('click', () => {
          app.querySelectorAll('[data-review-field]').forEach(el => {
            const key = el.dataset.reviewField;
            const val = el.value.trim();
            if (val !== '') p[key] = val;
          });
          docAnalysisResult = null;
          save();
          render();
        });
        const docCancelBtn = document.getElementById('doc-review-cancel');
        if (docCancelBtn) docCancelBtn.addEventListener('click', () => { docAnalysisResult = null; docAnalysisError = ''; render(); });
      }

      if (openTab === 'loyer') {
        app.querySelectorAll('[data-year-toggle]').forEach(el => {
          el.addEventListener('click', () => { expandedLoyerYear = (expandedLoyerYear === el.dataset.yearToggle) ? null : el.dataset.yearToggle; render(); });
        });
        app.querySelectorAll('.loyer-month-row').forEach(row => {
          const y = row.dataset.year, m = row.dataset.month;
          if (!p.loyer_registre[y]) p.loyer_registre[y] = {};
          if (!p.loyer_registre[y][m]) p.loyer_registre[y][m] = {statut:'impaye', date:'', montant:'', montant_paye:''};
          const statutSel = row.querySelector('.lm-statut');
          const dateInp = row.querySelector('.lm-date');
          const montantInp = row.querySelector('.lm-montant');
          const chargesInp = row.querySelector('.lm-charges');
          const montantPayeInp = row.querySelector('.lm-montant-paye');
          const totalSpan = row.querySelector('.lm-total');
          const refreshTotal = () => {
            const entryRef = p.loyer_registre[y][m];
            const defaultMontant = p.loyer ? defaultMonthlyLoyer(p) : null;
            const defaultCharges = p.charges_mensuelles ? (parseNum(p.charges_mensuelles)||0) : null;
            const amounts = loyerMonthAmounts(p, entryRef, defaultMontant, defaultCharges);
            if (totalSpan) totalSpan.textContent = `TVA ${formatMoney(amounts.tva)} · TTC ${formatMoney(amounts.totalTTC)}`;
          };
          statutSel.addEventListener('change', () => {
            const entryRef = p.loyer_registre[y][m];
            entryRef.statut = statutSel.value;
            if (!entryRef.montant) {
              const defaultMontant = p.loyer ? defaultMonthlyLoyer(p) : null;
              if (defaultMontant) entryRef.montant = String(defaultMontant);
            }
            save();
            render();
          });
          dateInp.addEventListener('input', () => { p.loyer_registre[y][m].date = dateInp.value; scheduleSave(); });
          dateInp.addEventListener('blur', () => save());
          montantInp.addEventListener('input', () => { p.loyer_registre[y][m].montant = montantInp.value; scheduleSave(); refreshTotal(); });
          montantInp.addEventListener('blur', () => save());
          chargesInp.addEventListener('input', () => { p.loyer_registre[y][m].charges = chargesInp.value; scheduleSave(); refreshTotal(); });
          chargesInp.addEventListener('blur', () => save());
          montantPayeInp.addEventListener('input', () => { p.loyer_registre[y][m].montant_paye = montantPayeInp.value; scheduleSave(); });
          montantPayeInp.addEventListener('blur', () => save());
        });
        const addYearBtn = document.getElementById('add-loyer-year');
        if (addYearBtn) addYearBtn.addEventListener('click', () => {
          const y = window.prompt('Année à ajouter :', String(new Date().getFullYear()));
          if (!y || !/^\d{4}$/.test(y)) return;
          if (!p.loyer_registre) p.loyer_registre = {};
          if (!p.loyer_registre[y]) {
            p.loyer_registre[y] = {};
            for (let i=1;i<=12;i++) { p.loyer_registre[y][String(i).padStart(2,'0')] = {statut:'impaye', date:'', montant:'', montant_paye:'', charges:''}; }
          }
          expandedLoyerYear = y;
          save();
          render();
        });

        const revStartBtn = document.getElementById('revision-start-btn');
        if (revStartBtn) revStartBtn.addEventListener('click', () => {
          const dateTxt = p.revision_date_prochaine ? new Date(p.revision_date_prochaine).toLocaleDateString('fr-FR') : '(date non renseignée)';
          if (!window.confirm(`Faire la révision de loyer effective au ${dateTxt} ?`)) return;
          const text = buildRevisionPrompt(p, scis.find(s => s.id === p.sci_id));
          const showCopiedFlag = () => {
            const flag = document.getElementById('save-flag');
            if (flag) { flag.textContent = 'Texte copié — collez-le dans un chat Claude'; setTimeout(()=>{ if(flag) flag.textContent=''; }, 3000); }
          };
          if (navigator.clipboard && navigator.clipboard.writeText) {
            navigator.clipboard.writeText(text).then(showCopiedFlag).catch(()=>{ window.prompt('Copiez ce texte :', text); });
          } else {
            window.prompt('Copiez ce texte :', text);
          }
          revisionFormOpen = true;
          render();
        });

        const revCancelBtn = document.getElementById('revision-cancel-btn');
        if (revCancelBtn) revCancelBtn.addEventListener('click', () => { revisionFormOpen = false; render(); });

        const revValidateBtn = document.getElementById('revision-validate-btn');
        if (revValidateBtn) revValidateBtn.addEventListener('click', () => {
          const newIndiceValeur = (document.getElementById('rev-new-indice-valeur').value || '').trim();
          const newIndiceTrimestre = (document.getElementById('rev-new-indice-trimestre').value || '').trim();
          const newLoyer = parseNum(document.getElementById('rev-new-loyer').value);
          if (!newLoyer) { alert('Merci de renseigner le nouveau loyer annuel HT.'); return; }

          const effectiveDate = p.revision_date_prochaine || new Date().toISOString().slice(0,10);
          p.derniere_revision = {
            date_effet: effectiveDate,
            ancien_loyer: p.loyer,
            nouveau_loyer: newLoyer,
            indice_type: p.revision_indice_type || '',
            ancien_indice_valeur: p.revision_indice_valeur || '',
            ancien_indice_trimestre: p.revision_indice_trimestre || '',
            nouvel_indice_valeur: newIndiceValeur,
            nouvel_indice_trimestre: newIndiceTrimestre
          };

          p.loyer = String(newLoyer);
          p.revision_indice_valeur = newIndiceValeur;
          p.revision_indice_trimestre = newIndiceTrimestre;
          p.revision_date_prochaine = addInterval(effectiveDate, 'annuelle') || effectiveDate;

          const newMonthly = Math.round((newLoyer/12) * 100) / 100;
          const effDate = new Date(effectiveDate);
          Object.keys(p.loyer_registre || {}).forEach(y => {
            Object.keys(p.loyer_registre[y]).forEach(mm => {
              const entry = p.loyer_registre[y][mm];
              const entryDate = new Date(parseInt(y,10), parseInt(mm,10)-1, 1);
              if (entryDate >= effDate && entry.statut === 'impaye') {
                entry.montant = String(newMonthly);
              }
            });
          });

          revisionFormOpen = false;
          save();
          render();
          alert('Révision enregistrée. Vous pouvez générer le courrier dans "Générer un document".');
        });
      }

      const echDoneBtns = app.querySelectorAll('.echeance-done');
      echDoneBtns.forEach(el => {
        el.addEventListener('click', () => {
          const df = el.dataset.datefield, rf = el.dataset.recfield;
          const recurrence = el.dataset.recfixed || p[rf];
          const newDate = addInterval(p[df], recurrence);
          if (newDate) { p[df] = newDate; save(); render(); }
          else { alert('Choisissez une récurrence (mensuelle, trimestrielle, annuelle) avant de marquer comme réglé.'); }
        });
      });

      if (openTab === 'financement') {
        app.querySelectorAll('[data-credit-year-toggle]').forEach(el => {
          el.addEventListener('click', () => { expandedCreditYear = (expandedCreditYear === el.dataset.creditYearToggle) ? null : el.dataset.creditYearToggle; render(); });
        });
        app.querySelectorAll('.credit-month-row').forEach(row => {
          const y = row.dataset.year, m = row.dataset.month;
          const statutSel = row.querySelector('.cm2-statut');
          const dateInp = row.querySelector('.cm2-date');
          statutSel.addEventListener('change', () => {
            p.credit_registre[y][m].statut = statutSel.value;
            save();
            render();
          });
          dateInp.addEventListener('input', () => { p.credit_registre[y][m].date = dateInp.value; scheduleSave(); });
          dateInp.addEventListener('blur', () => save());
        });
        const addCreditYearBtn = document.getElementById('add-credit-year');
        if (addCreditYearBtn) addCreditYearBtn.addEventListener('click', () => {
          const y = window.prompt('Année à ajouter :', String(new Date().getFullYear()));
          if (!y || !/^\d{4}$/.test(y)) return;
          if (!p.credit_registre) p.credit_registre = {};
          if (!p.credit_registre[y]) {
            p.credit_registre[y] = {};
            for (let i=1;i<=12;i++) { p.credit_registre[y][String(i).padStart(2,'0')] = {statut:'impaye', date:'', mensualite:'', capital:'', interets:'', crd:''}; }
          }
          expandedCreditYear = y;
          save();
          render();
        });
      }

      if (openTab === 'generation') {
        const typeSel = document.getElementById('gen-type');
        if (typeSel) typeSel.addEventListener('change', () => { genDocType = typeSel.value; genMessage=''; genDraftUrl=null; render(); });
        const periodTypeSel = document.getElementById('gen-period-type');
        if (periodTypeSel) periodTypeSel.addEventListener('change', () => { genPeriodType = periodTypeSel.value; genMessage=''; genDraftUrl=null; render(); });
        const yearSel = document.getElementById('gen-year');
        if (yearSel) yearSel.addEventListener('change', () => { genYear = yearSel.value; genMessage=''; genDraftUrl=null; render(); });
        const monthSel = document.getElementById('gen-month');
        if (monthSel) monthSel.addEventListener('change', () => { genMonth = monthSel.value; genMessage=''; genDraftUrl=null; render(); });
        const quarterSel = document.getElementById('gen-quarter');
        if (quarterSel) quarterSel.addEventListener('change', () => { genQuarter = quarterSel.value; genMessage=''; genDraftUrl=null; render(); });
        const submitBtn = document.getElementById('gen-submit-btn');
        if (submitBtn) submitBtn.addEventListener('click', () => generateDocument(p));
      }
    }

    if (viewMode==='detail' && p) {
      const saveBtn = document.getElementById('save-btn');
      if (saveBtn) saveBtn.addEventListener('click', save);
      const delBtn = document.getElementById('del-btn');
      if (delBtn) delBtn.addEventListener('click', async () => {
        if (!window.confirm(`Supprimer définitivement "${propLabel(p)}" ? Cette action est irréversible.`)) return;
        delBtn.disabled = true;
        delBtn.textContent = 'Suppression…';
        deletedPropertyIds.push(p.id);
        const savedProperties = properties;
        properties = properties.filter(x => x.id !== p.id);
        const ok = await save();
        if (ok) {
          selectedId = null;
          viewMode = 'overview';
          openTab = null;
        } else {
          // La sauvegarde a échoué : on annule la suppression locale pour ne
          // pas afficher un bien "supprimé" qui existe encore sur le serveur.
          deletedPropertyIds = deletedPropertyIds.filter(id => id !== p.id);
          properties = savedProperties;
          window.alert(`Échec de la suppression de "${propLabel(p)}" (problème réseau ou serveur). Le bien n'a pas été supprimé. Réessayez.`);
        }
        render();
      });
    }
  }

  load();
})();
</script>
</body>
</html>
